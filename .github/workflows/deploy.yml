# Faz o build a cada push na main e publica o resultado na branch gh-pages.
# No GitHub: Settings > Pages > Source = "Deploy from a branch" > gh-pages / (root).
name: Deploy na branch gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # necessário para a Action gravar na branch gh-pages

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true # baixa as fotos e o vídeo guardados no Git LFS

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # o site fica em https://maluagro.github.io/portfolio/
          FIGMA_PUBLIC_URL: /portfolio

      # Copia a pasta dist para a branch gh-pages (arquivos normais, sem LFS)
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: true # mantém só a última versão, sem acumular histórico de imagens
          commit_message: Deploy do site
